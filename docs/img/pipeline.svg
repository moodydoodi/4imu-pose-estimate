<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 592" width="1240" height="592" font-family="Segoe UI, Calibri, Helvetica, sans-serif">
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7D8AA2"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FE0"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9661B"/></marker>
    <style>
      .card { fill:#FFFFFF; stroke:#DCE6F5; stroke-width:1.5; rx:10; }
      .h    { font-size:15px; font-weight:600; fill:#0F1E38; }
      .s    { font-size:12.5px; fill:#44577A; }
      .lane { font-size:11.5px; font-weight:700; letter-spacing:1.1px; }
      .tag  { font-size:11.5px; fill:#7D8AA2; font-style:italic; }
      .tagO { font-size:11.5px; fill:#D9661B; font-style:italic; }
      .g    { stroke:#7D8AA2; stroke-width:2; fill:none; marker-end:url(#aG); }
      .b    { stroke:#2F6FE0; stroke-width:2.4; fill:none; marker-end:url(#aB); }
      .o    { stroke:#D9661B; stroke-width:2.4; fill:none; marker-end:url(#aO); }
      .gd   { stroke:#7D8AA2; stroke-width:1.8; fill:none; stroke-dasharray:6 5; marker-end:url(#aG); }
      .od   { stroke:#D9661B; stroke-width:1.8; fill:none; stroke-dasharray:6 5; marker-end:url(#aO); }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="592" fill="#F4F7FC" rx="14"/>

  <!-- ============ lane A : real target ============ -->
  <text x="40" y="40" class="lane" fill="#7D8AA2">TARGET FOR THE REAL RECORDINGS</text>

  <rect class="card" x="40"  y="56" width="180" height="80"/>
  <text x="130" y="90"  class="h" text-anchor="middle">Video</text>
  <text x="130" y="112" class="s" text-anchor="middle">one session, ~50 fps</text>

  <rect class="card" x="270" y="56" width="210" height="80"/>
  <text x="375" y="90"  class="h" text-anchor="middle">MediaPipe pose</text>
  <text x="375" y="112" class="s" text-anchor="middle">33 landmarks → 13 joints</text>

  <rect class="card" x="530" y="56" width="180" height="80"/>
  <text x="620" y="84"  class="h" text-anchor="middle">Target pose</text>
  <text x="620" y="105" class="s" text-anchor="middle">pelvis-centred,</text>
  <text x="620" y="122" class="s" text-anchor="middle">heading removed</text>

  <line class="g" x1="222" y1="96" x2="266" y2="96"/>
  <line class="g" x1="482" y1="96" x2="526" y2="96"/>

  <line class="gd" x1="452" y1="140" x2="452" y2="206"/>
  <text x="440" y="178" class="tag" text-anchor="end">reference for sync and calibration</text>

  <!-- ============ lane B : real input ============ -->
  <text x="40" y="196" class="lane" fill="#2F6FE0">MODEL INPUT · REAL RECORDINGS</text>

  <rect class="card" x="40"  y="212" width="180" height="82"/>
  <text x="130" y="243" class="h" text-anchor="middle">4 × Axivity AX6</text>
  <text x="130" y="264" class="s" text-anchor="middle">200 Hz, wrists + ankles,</text>
  <text x="130" y="281" class="s" text-anchor="middle">no magnetometer</text>

  <rect class="card" x="270" y="212" width="210" height="82"/>
  <text x="375" y="243" class="h" text-anchor="middle">Sync + segment frame</text>
  <text x="375" y="264" class="s" text-anchor="middle">sensor axes mapped to the</text>
  <text x="375" y="281" class="s" text-anchor="middle">anatomical segment frame</text>

  <line class="b" x1="222" y1="253" x2="266" y2="253"/>
  <path class="b" d="M 484 253 C 508 253, 508 296, 524 300"/>

  <!-- ============ shared features ============ -->
  <rect class="card" x="528" y="256" width="182" height="120"/>
  <text x="619" y="292" class="h" text-anchor="middle">48 features</text>
  <text x="619" y="315" class="s" text-anchor="middle">12 per sensor, 50 Hz</text>
  <text x="619" y="334" class="s" text-anchor="middle">windows of 200 × 48</text>
  <text x="619" y="357" class="tag" text-anchor="middle">same channels both ways</text>

  <line class="b" x1="712" y1="316" x2="766" y2="316"/>

  <!-- ============ network ============ -->
  <rect class="card" x="770" y="256" width="180" height="120"/>
  <text x="860" y="290" class="h" text-anchor="middle">TCN + two</text>
  <text x="860" y="308" class="h" text-anchor="middle">BiLSTM stages</text>
  <text x="860" y="332" class="s" text-anchor="middle">stage 1: the 4 bones</text>
  <text x="860" y="349" class="s" text-anchor="middle">with a sensor</text>
  <text x="860" y="366" class="s" text-anchor="middle">stage 2: all 12 directions</text>

  <line class="b" x1="952" y1="316" x2="996" y2="316"/>

  <!-- ============ output ============ -->
  <rect class="card" x="1000" y="256" width="160" height="120"/>
  <text x="1080" y="292" class="h" text-anchor="middle">13-joint pose</text>
  <text x="1080" y="315" class="s" text-anchor="middle">12 bone directions</text>
  <text x="1080" y="332" class="s" text-anchor="middle">→ forward kinematics</text>
  <text x="1080" y="352" class="s" text-anchor="middle">→ 50 fps, body frame</text>

  <!-- ============ loss ============ -->
  <rect class="card" x="1000" y="56" width="160" height="80"/>
  <text x="1080" y="86"  class="h" text-anchor="middle">Training loss</text>
  <text x="1080" y="107" class="s" text-anchor="middle">how far the prediction</text>
  <text x="1080" y="124" class="s" text-anchor="middle">is from the target</text>

  <line class="g" x1="712" y1="96" x2="996" y2="96"/>
  <text x="854" y="86" class="tag" text-anchor="middle">real target</text>

  <line class="gd" x1="1080" y1="252" x2="1080" y2="142"/>
  <text x="1092" y="200" class="tag">prediction</text>

  <!-- ============ lane C : synthetic input AND synthetic target ============ -->
  <text x="40" y="364" class="lane" fill="#D9661B">PRE-TRAINING · SYNTHETIC INPUT AND ITS OWN TARGET</text>

  <rect class="card" x="40"  y="380" width="180" height="142"/>
  <text x="130" y="434" class="h" text-anchor="middle">AMASS mocap</text>
  <text x="130" y="456" class="s" text-anchor="middle">4.1 h of motion,</text>
  <text x="130" y="473" class="s" text-anchor="middle">no sensors attached</text>

  <rect class="card" x="270" y="380" width="210" height="72"/>
  <text x="375" y="405" class="h" text-anchor="middle">Virtual AX6</text>
  <text x="375" y="424" class="s" text-anchor="middle">derived from the motion,</text>
  <text x="375" y="441" class="s" text-anchor="middle">real noise, same segment frame</text>

  <rect class="card" x="270" y="462" width="210" height="60"/>
  <text x="375" y="487" class="h" text-anchor="middle">Synthetic target pose</text>
  <text x="375" y="507" class="s" text-anchor="middle">same skeleton, same body frame</text>

  <path class="o" d="M 222 451 C 244 451, 244 416, 264 416"/>
  <path class="o" d="M 222 451 C 244 451, 244 492, 264 492"/>

  <path class="o" d="M 484 416 C 508 416, 508 340, 524 336"/>

  <!-- synthetic target runs round the outside into the same loss -->
  <path class="od" d="M 484 492 L 1200 492 L 1200 96 L 1166 96"/>
  <text x="840" y="483" class="tagO" text-anchor="middle">synthetic target, same loss</text>

  <!-- ============ footnote ============ -->
  <text x="40" y="562" class="s">
    The video never reaches the network, and the two data sets are never mixed: the model is pre-trained on the synthetic pairs, then fine-tuned on the real recordings only.
  </text>
</svg>
